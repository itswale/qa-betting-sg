[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-betting-automation"
version = "0.1.0"
description = "Two Playwright tests for the betting take-home app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49.0",
    "pytest>=8.3.0",
    "pytest-html>=4.0.0",
    "pytest-playwright>=0.5.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
